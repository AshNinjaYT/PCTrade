<div class="product-grid" *ngIf="products.length > 0; else noResults">
  <app-product-card *ngFor="let product of products; trackBy: trackById" [item]="product"></app-product-card>
</div>

<ng-template #noResults>
  <div class="no-results">
    <p>No se han encontrado productos que coincidan con tu búsqueda.</p>
  </div>
</ng-template>
