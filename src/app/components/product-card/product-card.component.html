<div class="product-card">
  <div class="badge-top" *ngIf="element.esPopular">TOP</div>

  <a class="card-link" [routerLink]="['/element', element.id]">
    <div class="image-wrapper">
      <img [src]="element.imatgeUrl" [alt]="element.titol" class="product-image" loading="lazy">
    </div>

    <span class="category">{{ element.categoria }}</span>
    <h3>{{ element.titol }}</h3>
    <p class="description">{{ element.descripcio | slice:0:70 }}{{ element.descripcio.length > 70 ? '...' : '' }}</p>

    <div class="stats-row">
      <div class="price">{{ element.preu | currency:'EUR' }}</div>
      <div class="stock-badge" [class.low]="element.unitats < 5">
        <span class="dot"></span> {{ element.unitats }} uds
      </div>
    </div>
  </a>

  <div class="actions">
    <button class="fav-btn" [class.active]="isPreferit()" (click)="togglePreferit($event)">
      {{ isPreferit() ? '❤️ Quitar favoritos' : '🤍 Añadir favoritos' }}
    </button>
  </div>
</div>
