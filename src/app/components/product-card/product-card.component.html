<div class="product-card" role="article" [attr.aria-labelledby]="'title-' + element.id">
  <a [routerLink]="['/element', element.id]" class="card-link">
    <div class="image-wrapper">
      <img [src]="element.imatgeUrl" [alt]="element.titol" class="product-image">
    </div>
    <h3 [id]="'title-' + element.id">{{ element.titol }}</h3>
    <p class="category">{{ element.categoria }}</p>
    <p class="price" aria-label="Precio del producto">{{ element.preu | currency : "EUR" }}</p>
    <p class="description" *ngIf="element.descripcio" aria-label="Descripción del producto">{{ element.descripcio | slice:0:100 }}...</p>
  </a>
  <button class="fav-btn" 
          [class.active]="isPreferit()" 
          (click)="togglePreferit($event)"
          aria-label="Añadir a favoritos">
    <span *ngIf="isPreferit()">❤️ Quitar Favorito</span>
    <span *ngIf="!isPreferit()">🤍 Añadir Favorito</span>
  </button>
</div>
