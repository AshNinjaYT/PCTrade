<form #searchForm="ngForm" (ngSubmit)="emitSearch()" class="search-form" role="search">
  <div class="input-group">
    <input type="text" name="search" [(ngModel)]="searchTerm" #searchModel="ngModel"
      placeholder="Buscar hardware (ej: RTX 4090)..." minlength="3" class="search-input"
      (ngModelChange)="onInputChange()" aria-label="Campo de búsqueda de hardware informático">
    <button type="submit" [disabled]="searchModel.invalid && searchTerm.length > 0" class="search-button"
      aria-label="Ejecutar búsqueda filtrada">Buscar</button>
  </div>

  <div *ngIf="searchModel.invalid && (searchModel.dirty || searchModel.touched)" class="error-message">
    <span *ngIf="searchModel.errors?.['minlength']">Mínimo 3 caracteres para buscar.</span>
    <span *ngIf="searchModel.errors?.['required']">El campo es obligatorio.</span>
  </div>
</form>
