<form [formGroup]="cercaForm" (ngSubmit)="emitSearch()" class="search-container">
  <div class="search-bar-row">
    <div class="search-input-group">
      <input 
        type="text" 
        formControlName="termeCerca"
        placeholder="Buscar hardware (ej: rtx 4090)..."
        [class.is-invalid]="cercaForm.get('termeCerca')?.invalid && cercaForm.get('termeCerca')?.touched"
      >
      <button type="submit" class="btn-search" [disabled]="cercaForm.get('termeCerca')?.invalid">
        Buscar
      </button>
    </div>
    <button type="button" class="btn-filter" (click)="toggleFilters()">
      Filtros ▾
    </button>
  </div>
  
  <div *ngIf="cercaForm.get('termeCerca')?.invalid && cercaForm.get('termeCerca')?.touched" class="error-msg">
    <span *ngIf="cercaForm.get('termeCerca')?.errors?.['prohibit']">Esa palabra clave está totalmente prohibida.</span>
  </div>

  <div class="filters-dropdown" *ngIf="showFilters">
    <div class="checkboxes" formArrayName="categoriesArray">
      <label *ngFor="let control of categoriesControls; let i = index">
        <input type="checkbox" [formControlName]="i">
        {{ categories()[i] }}
      </label>
    </div>
  </div>
</form>
