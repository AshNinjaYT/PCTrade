<form [formGroup]="cercaForm" (ngSubmit)="emitSearch()" class="search-container">
  
  <div class="search-input-group">
    <input 
      type="text" 
      formControlName="termeCerca"
      placeholder="Buscar hardware (ej: rtx 4090)"
      [class.is-invalid]="cercaForm.get('termeCerca')?.invalid && cercaForm.get('termeCerca')?.touched"
    >
    <button type="submit" [disabled]="cercaForm.get('termeCerca')?.invalid">
      Buscar
    </button>
  </div>
  
  <div *ngIf="cercaForm.get('termeCerca')?.invalid && cercaForm.get('termeCerca')?.touched" class="error-msg">
    <span *ngIf="cercaForm.get('termeCerca')?.errors?.['required']">Palabra clave requerida.</span>
    <span *ngIf="cercaForm.get('termeCerca')?.errors?.['minlength']">Gasta unas teclas más, mínimo 3 carácteres.</span>
    <span *ngIf="cercaForm.get('termeCerca')?.errors?.['prohibit']">Esa palabra clave está totalmente prohibida (simulado desde servidor).</span>
  </div>

  <div class="filters-group">
    <p>Filtros Rápidos</p>
    <div class="checkboxes" formArrayName="categoriesArray">
      <label *ngFor="let control of categoriesControls; let i = index">
        <input type="checkbox" [formControlName]="i">
        {{ categories[i] }}
      </label>
    </div>
  </div>

</form>
